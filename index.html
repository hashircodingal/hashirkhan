<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">JavaScript Data Structure</p>
      <h1>Student Profile</h1>
      <p class="subtitle">Explore object properties and array methods in JavaScript.</p>
    </section>

    <section class="profile-card">
      <div class="avatar">R</div>
      <div>
        <h2 id="student-name"></h2>
        <p class="student-role">Creative student</p>
      </div>
    </section>

    <section class="details-grid">
      <div class="info-card">
        <span class="icon">🎂</span>
        <h3>Age</h3>
        <p id="student-age"></p>
      </div>

      <div class="info-card">
        <span class="icon">📚</span>
        <h3>Grade</h3>
        <p id="student-grade"></p>
      </div>

      <div class="info-card">
        <span class="icon">🎨</span>
        <h3>Hobby</h3>
        <p id="student-hobby"></p>
      </div>

      <div class="info-card">
        <span class="icon">🏏</span>
        <h3>Favorite Sport</h3>
        <p id="student-sport"></p>
      </div>
    </section>

    <section class="colors-card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Array Example</p>
          <h2>Favorite Colors</h2>
        </div>
        <span class="array-badge">.pop()</span>
      </div>

      <div class="color-output">
        <p><strong>Before popping:</strong></p>
        <div id="before-colors" class="color-list"></div>

        <p><strong>Favorite color:</strong></p>
        <div id="favorite-color" class="favorite-color"></div>

        <p><strong>After popping:</strong></p>
        <div id="after-colors" class="color-list"></div>
      </div>
    </section>

    <footer>
      Built with HTML, CSS and JavaScript
    </footer>
  </main>
</body>
</html>
